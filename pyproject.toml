[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "just-a-calendar"
version = "0.1.0"
description = "Local Windows desktop calendar with schedules, reminders, and free-time view"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]